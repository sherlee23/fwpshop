<!DOCTYPE html>
<html lang="zh-CN">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://edfnhhthztskuuosuasw.supabase.co/storage/v1/object/public/product-photos/icon3.jpg">

    <script src="config.js"></script>
    
    <style>

        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-4 { padding-top: 1rem; padding-bottom: 1rem; }
        .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
        .h-16 { height: 4rem; }
        .flex { display: flex; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .gap-2 { gap: 0.5rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-4 { gap: 1rem; }

        .text-xl { font-size: 1.25rem; }
        .font-bold { font-weight: bold; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .bg-white { background-color: white; }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-gray-100 { background-color: #f3f4f6; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-700 { color: #374151; }
        .text-red-600 { color: #dc2626; }
        .border-gray-200 { border-color: #e5e7eb; }
        .border-b { border-bottom-width: 1px; }
        .shadow-sm { box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05); }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-full { border-radius: 9999px; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .overflow-x-auto { overflow-x: auto; }
        .pb-2 { padding-bottom: 0.5rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .whitespace-nowrap { white-space: nowrap; }

        .hover\:bg-red-100:hover { background-color: #fee2e2; }
        .hover\:bg-red-50:hover { background-color: #fef2f2; }
        .hover\:text-red-200:hover { color: #fecaca; }
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .lg\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .xl\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .text-center { text-align: center; }
        .py-12 { padding-top: 3rem; padding-bottom: 3rem; }
        .w-8 { width: 2rem; }
        .h-8 { height: 2rem; }
        .border-4 { border-width: 4px; }
        .border-gray-300 { border-color: #d1d5db; }
        .border-top-red-600 { border-top-color: #dc2626; }
        .mb-4 { margin-bottom: 1rem; }
        .min-h-screen { min-height: 100vh; }
        .sm\:px-6 { padding-left: 1.5rem; padding-right: 1.5rem; }
        .lg\:px-8 { padding-left: 2rem; padding-right: 2rem; }
        .text-sm { font-size: 0.875rem; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .-top-2 { top: -0.5rem; }
        .-right-2 { right: -0.5rem; }
        .bg-yellow-400 { background-color: #facc15; }
        .text-black { color: black; }
        .text-xs { font-size: 0.75rem; }
        .h-6 { height: 1.5rem; }
        .w-6 { width: 1.5rem; }
        .justify-center { justify-content: center; }
        .cursor-pointer { cursor: pointer; }
        
        /* Product Card Styles */
        .product-card {
            background: white;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            transition: all 0.2s;
        }
        .product-card:hover {
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            transform: translateY(-2px);
        }
        .product-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #f3f4f6;
        }
        .product-info {
            padding: 1rem;
        }
        .product-name {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: #1f2937;
        }
        .product-price {
            font-size: 1.25rem;
            font-weight: bold;
            color: #dc2626;
            margin-bottom: 0.5rem;
        }
        .product-stock {
            font-size: 0.875rem;
            color: #6b7280;
            margin-bottom: 1rem;
        }
        .add-to-cart-btn {
            width: 100%;
            background: #dc2626;
            color: white;
            padding: 0.75rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .add-to-cart-btn:hover {
            background: #b91c1c;
        }
        .add-to-cart-btn:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }
        
        /* Modal styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 0.75rem;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 2rem;
        }
        
        /* Sidebar styles */
        .sidebar {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 10px rgba(0,0,0,0.1);
            transition: right 0.3s ease;
            z-index: 1000;
            display: flex;
            flex-direction: column;
        }
        .sidebar.open {
            right: 0;
        }
        
        /* Form styles */
        .form-group {
            margin-bottom: 1rem;
        }
        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: #374151;
        }
        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.5rem;
            font-size: 1rem;
            transition: border-color 0.2s;
        }
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #dc2626;
            box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.1);
        }
        
        /* Button styles */
        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            text-decoration: none;
            font-size: 1rem;
        }
        .btn-primary {
            background: #dc2626;
            color: white;
        }
        .btn-primary:hover {
            background: #b91c1c;
        }
        .btn-secondary {
            background: #6b7280;
            color: white;
        }
        .btn-secondary:hover {
            background: #4b5563;
        }
        .btn-success {
            background: #16a34a;
            color: white;
        }
        .btn-success:hover {
            background: #15803d;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .md\:grid-cols-2 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
            .lg\:grid-cols-3 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
            .xl\:grid-cols-4 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
            .sidebar { width: 100%; right: -100%; }
            .modal-content { width: 95%; padding: 1rem; }
            .sm\:px-6 { padding-left: 1rem; padding-right: 1rem; }
            .lg\:px-8 { padding-left: 1rem; padding-right: 1rem; }
        }
        
        /* Toast notification */
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #16a34a;
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            z-index: 1100;
        }
        .toast.error {
            background: #dc2626;
        }
    </style>
</head>
<body>
    <div id="root">
        <div id="loading" style="
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center; z-index: 9999;
        ">
            <div style="
                width: 40px; height: 40px; border: 4px solid #f3f4f6; 
                border-top: 4px solid #dc2626; border-radius: 50%; 
                animation: spin 1s linear infinite; margin: 0 auto 16px;
            "></div>
            <div>正在加载锋味派美食团购系统...</div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        // Configuration
        const SUPABASE_URL = window.AppConfig?.SUPABASE_URL || 'https://edfnhhthztskuuosuasw.supabase.co';
        const SUPABASE_ANON_KEY = window.AppConfig?.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkZm5oaHRoenRza3V1b3N1YXN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk5OTYxMTYsImV4cCI6MjA2NTU3MjExNn0.O3g2gjvsWagmWgmzoeJA8mPampvLYJr-KgqVwXsKoAo';
        const WHATSAPP_NUMBER = window.AppConfig?.WHATSAPP_NUMBER || '60162327792';
        const ADMIN_PASSWORD = window.AppConfig?.ADMIN_PASSWORD || 'fengweipaiadmin';
        const SELF_PICKUP_ADDRESS = window.AppConfig?.SELF_PICKUP_ADDRESS || '667, Jalan 24, Taman Perindustrian Ehsan Jaya, Kepong, 52100, Kuala Lumpur.';
        
        // Bank Details - Corrected as requested
        const BANK_DETAILS = {
            bank: 'Maybank',
            accountName: 'Choong Sher Lee',
            accountNumber: '114209540438'
        };
        
        // Supabase Client
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // QR Code URLs
        const QR_CODES = {
            maybank: 'https://edfnhhthztskuuosuasw.supabase.co/storage/v1/object/public/QR-code/maybank-qr.jpg',
            tng: 'https://edfnhhthztskuuosuasw.supabase.co/storage/v1/object/public/QR-code/tng-qr.jpg'
        };

        // Toast Component
        function Toast({ message, type, onClose }) {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);
            
            return (
                <div className={`toast ${type === 'error' ? 'error' : ''}`}>
                    {message}
                </div>
            );
        }

        // Product Card Component
        function ProductCard({ product, onAddToCart }) {
            const isOutOfStock = !product.is_unlimited && product.stock === 0;
            const stockText = product.is_unlimited ? '预购商品' : `库存: ${product.stock}`;
            
            return (
                <div className="product-card">
                    <img 
                        src={product.image || 'https://edfnhhthztskuuosuasw.supabase.co/storage/v1/object/public/product-photos/placeholder.jpg'} 
                        alt={product.name}
                        className="product-image"
                        onError={(e) => {
                            e.target.src = 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDIwMCAyMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiBmaWxsPSIjRjNGNEY2Ii8+CjxwYXRoIGQ9Ik03MCA3MEgxMzBWMTMwSDcwVjcwWiIgZmlsbD0iI0Q5RDlEOSIvPgo8cGF0aCBkPSJNODUgODVIMTE1VjExNUg4NVY4NVoiIGZpbGw9IiNCNUI1QjUiLz4KPC9zdmc+';
                        }}
                    />
                    <div className="product-info">
                        <div className="product-name">{product.name}</div>
                        <div className="product-price">RM {product.price?.toFixed(2)}</div>
                        <div className="product-stock">{stockText}</div>
                        <button 
                            className="add-to-cart-btn"
                            onClick={() => onAddToCart(product)}
                            disabled={isOutOfStock}
                        >
                            {isOutOfStock ? '缺货' : '加入购物车'}
                        </button>
                    </div>
                </div>
            );
        }

        // Cart Sidebar Component
        function CartSidebar({ cart, updateQuantity, cartTotal, totalItems, onClose, onCheckout }) {
            const removeFromCart = (productId) => {
                updateQuantity(productId, 0);
            };
            
            return (
                <>
                    <div className="modal-overlay" onClick={onClose}></div>
                    <div className="sidebar open">
                        <div style={{ padding: '1rem', borderBottom: '1px solid #e5e7eb' }}>
                            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                <h3 style={{ fontSize: '1.125rem', fontWeight: '600' }}>购物车 ({totalItems})</h3>
                                <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: '1.5rem', cursor: 'pointer' }}>×</button>
                            </div>
                        </div>
                        <div style={{ flex: 1, overflow: 'auto', padding: '1rem' }}>
                            {cart.length === 0 ? (
                                <p style={{ textAlign: 'center', color: '#6b7280' }}>购物车为空</p>
                            ) : (
                                cart.map(item => (
                                    <div key={item.id} style={{ display: 'flex', gap: '0.75rem', marginBottom: '1rem', padding: '0.75rem', border: '1px solid #e5e7eb', borderRadius: '0.5rem' }}>
                                        <img 
                                            src={item.image} 
                                            alt={item.name}
                                            style={{ width: '60px', height: '60px', objectFit: 'cover', borderRadius: '0.375rem' }}
                                        />
                                        <div style={{ flex: 1 }}>
                                            <div style={{ fontWeight: '500', marginBottom: '0.25rem' }}>{item.name}</div>
                                            <div style={{ color: '#dc2626', fontWeight: '600' }}>RM {item.price?.toFixed(2)}</div>
                                            <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', marginTop: '0.5rem' }}>
                                                <button 
                                                    onClick={() => updateQuantity(item.id, item.quantity - 1)}
                                                    style={{ width: '30px', height: '30px', border: '1px solid #d1d5db', background: 'white', borderRadius: '4px', cursor: 'pointer' }}
                                                >
                                                    -
                                                </button>
                                                <span style={{ minWidth: '30px', textAlign: 'center' }}>{item.quantity}</span>
                                                <button 
                                                    onClick={() => updateQuantity(item.id, item.quantity + 1)}
                                                    style={{ width: '30px', height: '30px', border: '1px solid #d1d5db', background: 'white', borderRadius: '4px', cursor: 'pointer' }}
                                                >
                                                    +
                                                </button>
                                                <button 
                                                    onClick={() => removeFromCart(item.id)}
                                                    style={{ marginLeft: 'auto', color: '#dc2626', background: 'none', border: 'none', cursor: 'pointer' }}
                                                >
                                                    删除
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                        {cart.length > 0 && (
                            <div style={{ padding: '1rem', borderTop: '1px solid #e5e7eb' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: '1rem', fontSize: '1.125rem', fontWeight: '600' }}>
                                    <span>总计:</span>
                                    <span style={{ color: '#dc2626' }}>RM {cartTotal.toFixed(2)}</span>
                                </div>
                                <button 
                                    onClick={onCheckout}
                                    className="btn btn-primary"
                                    style={{ width: '100%' }}
                                >
                                    结账
                                </button>
                            </div>
                        )}
                    </div>
                </>
            );
        }

        // Checkout Modal Component
        function CheckoutModal({ cart, total, onClose, showToast }) {
            const [formData, setFormData] = useState({
                customerName: '',
                phone: '',
                deliveryMethod: 'pickup',
                address: '',
                remarks: '',
                paymentMethod: 'maybank'
            });
            
            const handleSubmit = async (e) => {
                e.preventDefault();
                
                if (!formData.customerName || !formData.phone) {
                    showToast('请填写完整信息', 'error');
                    return;
                }
                
                try {
                    // Create order in database
                    const orderData = {
                        customer_name: formData.customerName,
                        phone: formData.phone,
                        delivery_method: formData.deliveryMethod,
                        delivery_address: formData.address,
                        remarks: formData.remarks,
                        payment_method: formData.paymentMethod,
                        total_amount: total,
                        items: cart.map(item => ({
                            product_id: item.id,
                            product_name: item.name,
                            quantity: item.quantity,
                            price: item.price
                        })),
                        status: 'pending',
                        created_at: new Date().toISOString()
                    };
                    
                    const { data, error } = await supabaseClient
                        .from('orders')
                        .insert([orderData])
                        .select();
                    
                    if (error) throw error;
                    
                    // Update product stock
                    for (const item of cart) {
                        if (!item.is_unlimited) {
                            await supabaseClient
                                .from('products')
                                .update({ stock_quantity: item.stock - item.quantity })
                                .eq('id', item.id);
                        }
                    }
                    
                    // Clear cart
                    window.location.reload();
                    
                    showToast('订单提交成功！');
                    onClose();
                    
                } catch (error) {
                    showToast('订单提交失败: ' + error.message, 'error');
                }
            };
            
            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '1rem' }}>
                            <h3 style={{ fontSize: '1.25rem', fontWeight: '600' }}>订单信息</h3>
                            <button onClick={onClose} style={{ background: 'none', border: 'none', fontSize: '1.5rem', cursor: 'pointer' }}>×</button>
                        </div>
                        
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">姓名 *</label>
                                <input 
                                    type="text"
                                    className="form-input"
                                    value={formData.customerName}
                                    onChange={(e) => setFormData({...formData, customerName: e.target.value})}
                                    required
                                />
                            </div>
                            
                            <div className="form-group">
                                <label className="form-label">手机号 *</label>
                                <input 
                                    type="tel"
                                    className="form-input"
                                    value={formData.phone}
                                    onChange={(e) => setFormData({...formData, phone: e.target.value})}
                                    required
                                />
                            </div>
                            
                            <div className="form-group">
                                <label className="form-label">取货方式</label>
                                <div style={{ display: 'flex', gap: '1rem' }}>
                                    <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <input 
                                            type="radio"
                                            name="deliveryMethod"
                                            value="pickup"
                                            checked={formData.deliveryMethod === 'pickup'}
                                            onChange={(e) => setFormData({...formData, deliveryMethod: e.target.value})}
                                        />
                                        自取
                                    </label>
                                    <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <input 
                                            type="radio"
                                            name="deliveryMethod"
                                            value="delivery"
                                            checked={formData.deliveryMethod === 'delivery'}
                                            onChange={(e) => setFormData({...formData, deliveryMethod: e.target.value})}
                                        />
                                        配送
                                    </label>
                                </div>
                            </div>
                            
                            {formData.deliveryMethod === 'pickup' && (
                                <div className="form-group">
                                    <label className="form-label">取货地址</label>
                                    <div style={{ padding: '0.75rem', background: '#f9fafb', borderRadius: '0.5rem', border: '1px solid #e5e7eb' }}>
                                        {SELF_PICKUP_ADDRESS}
                                    </div>
                                </div>
                            )}
                            
                            {formData.deliveryMethod === 'delivery' && (
                                <>
                                    <div className="form-group">
                                        <label className="form-label">配送地址 *</label>
                                        <textarea 
                                            className="form-textarea"
                                            value={formData.address}
                                            onChange={(e) => setFormData({...formData, address: e.target.value})}
                                            placeholder="请输入详细地址"
                                            required
                                        />
                                    </div>
                                    <div className="form-group">
                                        <label className="form-label">备注</label>
                                        <textarea 
                                            className="form-textarea"
                                            value={formData.remarks}
                                            onChange={(e) => setFormData({...formData, remarks: e.target.value})}
                                            placeholder="配送备注（可选）"
                                        />
                                    </div>
                                </>
                            )}
                            
                            <div className="form-group">
                                <label className="form-label">付款方式</label>
                                <div style={{ display: 'flex', gap: '1rem' }}>
                                    <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <input 
                                            type="radio"
                                            name="paymentMethod"
                                            value="maybank"
                                            checked={formData.paymentMethod === 'maybank'}
                                            onChange={(e) => setFormData({...formData, paymentMethod: e.target.value})}
                                        />
                                        Maybank转账
                                    </label>
                                    <label style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <input 
                                            type="radio"
                                            name="paymentMethod"
                                            value="tng"
                                            checked={formData.paymentMethod === 'tng'}
                                            onChange={(e) => setFormData({...formData, paymentMethod: e.target.value})}
                                        />
                                        TNG eWallet
                                    </label>
                                </div>
                            </div>
                            
                            {/* Payment QR Codes */}
                            <div className="form-group">
                                <label className="form-label">付款二维码</label>
                                {formData.paymentMethod === 'maybank' && (
                                    <div>
                                        <img 
                                            src={QR_CODES.maybank}
                                            alt="Maybank QR Code"
                                            style={{ width: '200px', height: '200px', objectFit: 'contain', margin: '0 auto', display: 'block' }}
                                            onError={(e) => {
                                                e.target.style.display = 'none';
                                                e.target.nextSibling.style.display = 'block';
                                            }}
                                        />
                                        <div style={{ display: 'none', textAlign: 'center', padding: '2rem', background: '#f3f4f6', borderRadius: '0.5rem' }}>
                                            QR码加载失败
                                        </div>
                                        <div style={{ marginTop: '1rem', padding: '0.75rem', background: '#f9fafb', borderRadius: '0.5rem' }}>
                                            <div style={{ fontWeight: '600', marginBottom: '0.5rem' }}>银行转账信息:</div>
                                            <div>银行: {BANK_DETAILS.bank}</div>
                                            <div>户名: {BANK_DETAILS.accountName}</div>
                                            <div>账号: {BANK_DETAILS.accountNumber}</div>
                                        </div>
                                    </div>
                                )}
                                
                                {formData.paymentMethod === 'tng' && (
                                    <div>
                                        <img 
                                            src={QR_CODES.tng}
                                            alt="TNG eWallet QR Code"
                                            style={{ width: '200px', height: '200px', objectFit: 'contain', margin: '0 auto', display: 'block' }}
                                            onError={(e) => {
                                                e.target.style.display = 'none';
                                                e.target.nextSibling.style.display = 'block';
                                            }}
                                        />
                                        <div style={{ display: 'none', textAlign: 'center', padding: '2rem', background: '#f3f4f6', borderRadius: '0.5rem' }}>
                                            QR码加载失败
                                        </div>
                                    </div>
                                )}
                            </div>
                            
                            <div style={{ marginTop: '1rem', padding: '1rem', background: '#f9fafb', borderRadius: '0.5rem' }}>
                                <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '1.125rem', fontWeight: '600' }}>
                                    <span>总金额:</span>
                                    <span style={{ color: '#dc2626' }}>RM {total.toFixed(2)}</span>
                                </div>
                            </div>
                            
                            <div style={{ display: 'flex', gap: '1rem', marginTop: '1rem' }}>
                                <button type="button" onClick={onClose} className="btn btn-secondary" style={{ flex: 1 }}>
                                    取消
                                </button>
                                <button type="submit" className="btn btn-primary" style={{ flex: 1 }}>
                                    提交订单
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Login Page Component
        function LoginPage({ onLogin, onBack, isPasswordVisible, setIsPasswordVisible }) {
            const [password, setPassword] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                onLogin(password);
            };
            
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center">
                    <div style={{ background: 'white', padding: '2rem', borderRadius: '0.75rem', boxShadow: '0 4px 6px rgba(0, 0, 0, 0.1)', width: '100%', maxWidth: '400px' }}>
                        <h2 style={{ fontSize: '1.5rem', fontWeight: '600', textAlign: 'center', marginBottom: '1.5rem' }}>管理员登录</h2>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">密码</label>
                                <div style={{ position: 'relative' }}>
                                    <input 
                                        type={isPasswordVisible ? 'text' : 'password'}
                                        className="form-input"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                        placeholder="请输入管理员密码"
                                        required
                                        style={{ paddingRight: '3rem' }}
                                    />
                                    <button
                                        type="button"
                                        onClick={() => setIsPasswordVisible(!isPasswordVisible)}
                                        style={{
                                            position: 'absolute',
                                            right: '0.75rem',
                                            top: '50%',
                                            transform: 'translateY(-50%)',
                                            background: 'none',
                                            border: 'none',
                                            cursor: 'pointer',
                                            fontSize: '1rem'
                                        }}
                                    >
                                        {isPasswordVisible ? '👁️' : '👁️‍🗨️'}
                                    </button>
                                </div>
                            </div>
                            <div style={{ display: 'flex', gap: '1rem' }}>
                                <button type="button" onClick={onBack} className="btn btn-secondary" style={{ flex: 1 }}>
                                    返回
                                </button>
                                <button type="submit" className="btn btn-primary" style={{ flex: 1 }}>
                                    登录
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }

        // Admin Dashboard Component (Simplified)
        function AdminDashboard({ onLogout, products, fetchProducts, showToast }) {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            return (
                <div className="min-h-screen bg-gray-50">
                    <header className="bg-red-600 text-white">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <h1 className="text-xl font-bold">🍽️ 锋味派管理后台</h1>
                                <button onClick={onLogout} className="text-white hover:text-red-200">
                                    退出登录
                                </button>
                            </div>
                        </div>
                    </header>
                    
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        <div style={{ display: 'flex', gap: '1rem', marginBottom: '2rem' }}>
                            <button 
                                onClick={() => setActiveTab('dashboard')}
                                className={`btn ${activeTab === 'dashboard' ? 'btn-primary' : 'btn-secondary'}`}
                            >
                                📊 仪表盘
                            </button>
                            <button 
                                onClick={() => setActiveTab('products')}
                                className={`btn ${activeTab === 'products' ? 'btn-primary' : 'btn-secondary'}`}
                            >
                                📦 商品管理
                            </button>
                            <button 
                                onClick={() => setActiveTab('orders')}
                                className={`btn ${activeTab === 'orders' ? 'btn-primary' : 'btn-secondary'}`}
                            >
                                📋 订单管理
                            </button>
                        </div>
                        
                        {activeTab === 'dashboard' && (
                            <div style={{ background: 'white', padding: '2rem', borderRadius: '0.75rem', textAlign: 'center' }}>
                                <h3 style={{ fontSize: '1.5rem', fontWeight: '600', marginBottom: '1rem' }}>系统概览</h3>
                                <p>管理后台功能正在开发中...</p>
                                <div style={{ marginTop: '2rem' }}>
                                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(200px, 1fr))', gap: '1rem' }}>
                                        <div style={{ background: '#f9fafb', padding: '1rem', borderRadius: '0.5rem' }}>
                                            <div style={{ color: '#6b7280', fontSize: '0.875rem' }}>总商品数</div>
                                            <div style={{ fontSize: '1.5rem', fontWeight: '600' }}>{products.length}</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                        
                        {activeTab === 'products' && (
                            <div style={{ background: 'white', padding: '2rem', borderRadius: '0.75rem' }}>
                                <h3 style={{ fontSize: '1.5rem', fontWeight: '600', marginBottom: '1rem' }}>商品管理</h3>
                                <p>商品管理功能正在开发中...</p>
                            </div>
                        )}
                        
                        {activeTab === 'orders' && (
                            <div style={{ background: 'white', padding: '2rem', borderRadius: '0.75rem' }}>
                                <h3 style={{ fontSize: '1.5rem', fontWeight: '600', marginBottom: '1rem' }}>订单管理</h3>
                                <p>订单管理功能正在开发中...</p>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // Main App Component
        function App() {
            const [currentView, setCurrentView] = useState('customer');
            const [products, setProducts] = useState([]);
            const [cart, setCart] = useState([]);
            const [categories, setCategories] = useState([]);
            const [activeCategory, setActiveCategory] = useState('all');
            const [isLoading, setIsLoading] = useState(true);
            const [isCartOpen, setIsCartOpen] = useState(false);
            const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);
            const [toast, setToast] = useState(null);
            const [isPasswordVisible, setIsPasswordVisible] = useState(false);
            
            const showToast = (message, type = 'success') => {
                setToast({ message, type });
            };
            
            // Fetch products and extract categories
            const fetchProducts = async () => {
                setIsLoading(true);
                try {
                    const { data, error } = await supabaseClient
                        .from('products')
                        .select('*')
                        .eq('is_published', true)
                        .order('category, name');
                        
                    if (error) throw error;
                    
                    const formattedProducts = data.map(product => ({
                        ...product,
                        image: product.image_url || product.image || 'data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAwIiBoZWlnaHQ9IjIwMCIgdmlld0JveD0iMCAwIDIwMCAyMDAiIGZpbGw9Im5vbmUiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+CjxyZWN0IHdpZHRoPSIyMDAiIGhlaWdodD0iMjAwIiBmaWxsPSIjRjNGNEY2Ii8+CjxwYXRoIGQ9Ik03MCA3MEgxMzBWMTMwSDcwVjcwWiIgZmlsbD0iI0Q5RDlEOSIvPgo8cGF0aCBkPSJNODUgODVIMTE1VjExNUg4NVY4NVoiIGZpbGw9IiNCNUI1QjUiLz4KPC9zdmc+',
                        stock: product.stock_quantity || 0
                    }));
                    
                    setProducts(formattedProducts);
                    
                    // Extract unique categories from products
                    const productCategories = [...new Set(data.map(p => p.category).filter(Boolean))];
                    setCategories([
                        { id: 'all', name: '🍽️全部商品', emoji: '🍽️' },
                        ...productCategories.map(cat => ({
                            id: cat,
                            name: cat,
                            emoji: getCategoryEmoji(cat)
                        }))
                    ]);
                    
                } catch (error) {
                    showToast('加载商品失败: ' + error.message, 'error');
                    setProducts([]);
                }
                setIsLoading(false);
            };
            
            // Get emoji for category
            const getCategoryEmoji = (category) => {
                const emojiMap = {
                    '烤肠系列': '🌭',
                    '烧卖系列': '🥟',
                    '水饺系列': '🥟',
                    '鱼丸系列': '🐟',
                    '面食系列': '🍜',
                    '饭类系列': '🍚',
                    '汤品系列': '🍲',
                    '饮料系列': '🥤',
                    '热销套餐': '🔥',
                    '面条类': '🍜',
                    '饭类': '🍚',
                    '汤品': '🍲',
                    '小食': '🥨',
                    '调料': '🧂',
                    '饮料': '🥤'
                };
                return emojiMap[category] || '🍽️';
            };
            
            useEffect(() => {
                fetchProducts();
                // Hide loading after initialization
                setTimeout(() => {
                    const loading = document.getElementById('loading');
                    if (loading) loading.style.display = 'none';
                }, 1000);
            }, []);
            
            // Filter products by category
            const filteredProducts = activeCategory === 'all' 
                ? products 
                : products.filter(p => p.category === activeCategory);
            
            // Add to cart function
            const addToCart = (product) => {
                const existingItem = cart.find(item => item.id === product.id);
                if (existingItem) {
                    updateQuantity(product.id, existingItem.quantity + 1);
                } else {
                    setCart([...cart, { ...product, quantity: 1 }]);
                }
                showToast(`${product.name} 已添加到购物车`);
            };
            
            // Update quantity
            const updateQuantity = (productId, newQuantity) => {
                if (newQuantity <= 0) {
                    setCart(cart.filter(item => item.id !== productId));
                } else {
                    setCart(cart.map(item => 
                        item.id === productId 
                            ? { ...item, quantity: newQuantity }
                            : item
                    ));
                }
            };
            
            // Calculate totals
            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            
            // Login function
            const handleLogin = (password) => {
                if (password === ADMIN_PASSWORD) {
                    setCurrentView('admin');
                    showToast('登录成功！');
                    return true;
                } else {
                    showToast('密码错误，请重试', 'error');
                    return false;
                }
            };
            
            if (currentView === 'login') {
                return <LoginPage onLogin={handleLogin} onBack={() => setCurrentView('customer')} isPasswordVisible={isPasswordVisible} setIsPasswordVisible={setIsPasswordVisible} />;
            }
            
            if (currentView === 'admin') {
                return <AdminDashboard onLogout={() => setCurrentView('customer')} products={products} fetchProducts={fetchProducts} showToast={showToast} />;
            }
            
            return (
                <div className="min-h-screen bg-gray-50">
                    {/* Toast */}
                    {toast && (
                        <Toast 
                            message={toast.message} 
                            type={toast.type} 
                            onClose={() => setToast(null)} 
                        />
                    )}
                    
                    {/* Header */}
                    <header className="bg-red-600 text-white sticky top-0 z-50">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="flex items-center justify-between h-16">
                                <div className="flex items-center gap-3">
                                    <h1 className="text-xl font-bold">🍽️ 锋味派美食</h1>
                                </div>
                                <div className="flex items-center gap-4">
                                    <button
                                        onClick={() => setCurrentView('login')}
                                        className="text-white hover:text-red-200 text-sm font-medium transition-colors"
                                    >
                                        管理员
                                    </button>
                                    {cart.length > 0 && (
                                        <button
                                            onClick={() => setIsCartOpen(true)}
                                            className="relative bg-white text-red-600 px-4 py-2 rounded-lg font-semibold hover:bg-red-50 transition-colors"
                                        >
                                            购物车 ({totalItems})
                                            <span className="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs font-bold rounded-full h-6 w-6 flex items-center justify-center">
                                                {totalItems}
                                            </span>
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </header>
                    
                    {/* Category Navigation */}
                    <div className="bg-white shadow-sm sticky top-16 z-40 border-b border-gray-200">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                            <div className="flex gap-2 overflow-x-auto pb-2">
                                {categories.map(category => (
                                    <button
                                        key={category.id}
                                        onClick={() => setActiveCategory(category.id)}
                                        className={`flex-shrink-0 px-4 py-2 rounded-full font-medium transition-colors whitespace-nowrap ${
                                            activeCategory === category.id
                                                ? 'bg-red-600 text-white'
                                                : 'bg-gray-100 text-gray-700 hover:bg-red-100'
                                        }`}
                                    >
                                        {category.emoji} {category.name}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                    
                    {/* Products Grid */}
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
                        {isLoading ? (
                            <div className="text-center py-12">
                                <div className="animate-spin w-8 h-8 border-4 border-gray-300 border-top-red-600 rounded-full mx-auto mb-4"></div>
                                <p className="text-gray-500">加载中...</p>
                            </div>
                        ) : products.length === 0 ? (
                            <div className="text-center py-12">
                                <p className="text-gray-500">该分类下暂无商品</p>
                            </div>
                        ) : (
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                                {filteredProducts.map(product => (
                                    <ProductCard 
                                        key={product.id} 
                                        product={product} 
                                        onAddToCart={addToCart}
                                    />
                                ))}
                            </div>
                        )}
                    </div>
                    
                    {/* Cart Sidebar */}
                    {isCartOpen && (
                        <CartSidebar 
                            cart={cart}
                            updateQuantity={updateQuantity}
                            cartTotal={cartTotal}
                            totalItems={totalItems}
                            onClose={() => setIsCartOpen(false)}
                            onCheckout={() => {
                                setIsCartOpen(false);
                                setIsCheckoutOpen(true);
                            }}
                        />
                    )}
                    
                    {/* Checkout Modal */}
                    {isCheckoutOpen && (
                        <CheckoutModal 
                            cart={cart}
                            total={cartTotal}
                            onClose={() => setIsCheckoutOpen(false)}
                            showToast={showToast}
                        />
                    )}
                </div>
            );
        }

        // Initialize app
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
